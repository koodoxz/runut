[package]
name = "mimir-xdp"
version = "0.1.0"
edition = "2021"

[dependencies]
# Aya userspace
aya = "0.13"
aya-log = "0.2"

# Async runtime
tokio = { version = "1", features = ["full", "rt-multi-thread", "signal"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# DNS
trust-dns-proto = "0.23"

# Utilities
bytes = "1"

[[bin]]
name = "mimir-xdp"
path = "src/main.rs"
