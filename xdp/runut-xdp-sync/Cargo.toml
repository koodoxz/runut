[package]
name = "runut-xdp-sync"
version = "1.0.0"
edition = "2021"
description = "Lightweight sync bridge for RUNUT XDP DNS cache"

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
aya = "0.12"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
