[package]
name = "mimir-rs"
version = "0.1.0"
edition = "2021"
authors = ["Runut Contributors"]
description = "Ultra Blazzing Fast DNS Guardian - Rust Edition"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }

# DNS protocol
trust-dns-proto = "0.23"

# Concurrent data structures
dashmap = "6"

# LRU cache
lru = "0.12"

# Bloom filter
bloomfilter = "1"

# Configuration
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# TLS
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"

# QUIC for DoQ
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }

# HTTP for DoH and SVALINN client
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Metrics
prometheus = "0.13"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"
futures = "0.3"  # For parallel query racing

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
bytes = "1"
parking_lot = "0.12"
once_cell = "1"
chrono = "0.4"
base64 = "0.22"
rand = "0.8"  # For root server randomization
num_cpus = "1.16"
socket2 = { version = "0.5", features = ["all"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "mimir"
path = "src/main.rs"
